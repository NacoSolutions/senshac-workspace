version = 1

[workspace]
name = "senshac-workspace"
mode = "local-only"
canonical_tracker = "senshac-web"

[[repositories]]
name = "senshac-web"
path = "../../senshac"
role = "live web implementation"
status = "active"

[[repositories]]
name = "senshac-content"
path = "../../senshac-content"
role = "future Tina content repository"
status = "planned"

[[repositories]]
name = "senshac-infra"
path = "../../senshac-infra"
role = "Cloudflare infrastructure"
status = "planned"

[[repositories]]
name = "senshac-runner"
path = "../../senshac-runner"
role = "Flox and CI runner"
status = "active"

[[repositories]]
name = "senshac-media-runner"
path = "../../senshac-media-runner"
role = "media processing and ingestion"
status = "planned"
