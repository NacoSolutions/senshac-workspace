version = 1

[workspace]
name = "senshac-workspace"
mode = "github"
canonical_tracker = "senshac-workspace"

[[repositories]]
name = "senshac-web"
path = "../../senshac-web"
url = "https://github.com/NacoSolutions/senshac-web.git"
role = "future Astro/TinaCMS web implementation"
status = "placeholder"

[[repositories]]
name = "senshac-content"
path = "../../senshac-content"
url = "https://github.com/NacoSolutions/senshac-content.git"
role = "future Tina content repository"
status = "active"

[[repositories]]
name = "senshac-workspace"
path = "."
url = "https://github.com/NacoSolutions/senshac-workspace.git"
role = "workspace registry and operator tooling"
status = "active"

[[repositories]]
name = "senshac-infra"
path = "../../senshac-infra"
url = "https://github.com/NacoSolutions/senshac-infra.git"
role = "Cloudflare infrastructure"
status = "active"

[[repositories]]
name = "senshac-runner"
path = "../../senshac-runner"
url = "https://github.com/NacoSolutions/senshac-runner.git"
role = "Flox and CI runner"
status = "active"

[[repositories]]
name = "senshac-media-runner"
path = "../../senshac-media-runner"
url = "https://github.com/NacoSolutions/senshac-media-runner.git"
role = "media processing and ingestion"
status = "active"
