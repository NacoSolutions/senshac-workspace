name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify workspace registry contracts
        run: ./scripts/workspace-test
      - name: Verify JSONL merge strategy
        run: |
          for path in .seeds/issues.jsonl .seeds/plans.jsonl .seeds/templates.jsonl .mulch/expertise/example.jsonl; do
            test "$(git check-attr merge -- "$path" | awk '{print $3}')" = union
          done
