name: CI

on:
  # Pull requests are the validation boundary; protected main consumes the
  # already-validated merge instead of running the same contract again.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workspace-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify workspace registry contracts
        run: ./scripts/workspace-test
      - name: Verify JSONL merge strategy
        run: |
          for path in .seeds/issues.jsonl .seeds/plans.jsonl .seeds/templates.jsonl .mulch/expertise/example.jsonl; do
            test "$(git check-attr merge -- "$path" | awk '{print $3}')" = union
          done
