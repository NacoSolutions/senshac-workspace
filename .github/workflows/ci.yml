name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify workspace registry contracts
        run: ./scripts/workspace-test
      - name: Verify Seeds merge strategy
        run: |
          test -x scripts/merge-seeds-jsonl.ts
          git config merge.seeds-jsonl.driver "bun $PWD/scripts/merge-seeds-jsonl.ts %O %A %B"
          for path in .seeds/issues.jsonl .seeds/plans.jsonl .seeds/templates.jsonl; do
            test "$(git check-attr merge -- "$path" | awk '{print $3}')" = seeds-jsonl
          done
          grep -q 'usage: merge-seeds-jsonl.ts' scripts/merge-seeds-jsonl.ts
